[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-gguf-restore"
version = "0.1.0"
description = "Recover standalone GGUF files from Ollama's on-disk model blobs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "diaoyunxi" },
]
keywords = ["ollama", "gguf", "llm", "local-ai", "restore"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
ollama-gguf-restore = "ollama_gguf_restore.cli:main"

[project.urls]
Homepage = "https://github.com/diaoyunxi/ollama-gguf-restore"

[tool.setuptools]
packages = ["ollama_gguf_restore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
